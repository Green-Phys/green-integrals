name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-macos:
    # Build and test on the newest macOS runner (Apple silicon), Homebrew toolchain.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          brew install open-mpi hdf5 eigen openblas 

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix)"
          cmake --build build -j 3

      - name: Test
        env:
          HDF5_USE_FILE_LOCKING: 'FALSE'
          OMP_NUM_THREADS: 1
        run: |
          ctest --test-dir build -j 1 --output-on-failure

  build:

    strategy:
      fail-fast: false

    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          module load BuildEnv/gcc-12.2.0.lua;
          mkdir -p build && cd build;
          cmake -DCMAKE_CXX_FLAGS=" --coverage -fno-inline -fno-inline-small-functions -fno-default-inline -fprofile-arcs -ftest-coverage " ..;
          make -j 8;

      - name: Test
        env:
          HDF5_USE_FILE_LOCKING: 'FALSE'
          OMP_NUM_THREADS: 1
        run: |
            module load BuildEnv/gcc-12.2.0.lua;
            cd build;
            export CTEST_OUTPUT_ON_FAILURE=1
            ctest -j 1

      - name: Run coverage
        run: |
          module load BuildEnv/gcc-12.2.0.lua;
          cd build;
          lcov --capture --directory . --output-file coverage.info;
          lcov --remove coverage.info '/usr/*' --output-file coverage.info
          lcov --remove coverage.info '/opt/ohpc/pub/compiler/*' --output-file coverage.info
          lcov --remove coverage.info '*_deps*' --output-file coverage.info
          lcov --remove coverage.info '*libs*' --output-file coverage.info
          lcov --list coverage.info

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        with:
          flags: unittests
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
